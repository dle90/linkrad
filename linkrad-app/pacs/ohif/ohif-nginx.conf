server {
  gzip_static  always;
  gzip_proxied expired no-cache no-store private auth;
  gunzip       on;
  listen 80 default_server;
  listen [::]:80 default_server;

  # Serve OHIF app
  # COOP+COEP headers REQUIRED to enable SharedArrayBuffer, which Cornerstone3D's
  # streaming volume loader depends on for MPR / 3D rendering. Without these,
  # MPR/3D viewports render as empty black panes (see iter 11 deep-dive notes).
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    # CORP: cross-origin so the OHIF page can be embedded as an iframe inside
    # the LinkRad reading workspace (different origin) under COEP require-corp.
    # Without this the iframe shows "localhost refused to connect".
    add_header Cross-Origin-Resource-Policy cross-origin;
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    gzip_static on;
  }

  # Force browsers + iframe wrappers to revalidate our injected scripts on every
  # navigation. The OHIF bundle assets are content-hashed (cacheable) but our
  # linkrad-extras.js / linkrad-toolbar.js / app-config.js are not — without
  # this, iframes embedding OHIF can serve a stale cached version after redeploy.
  location ~ ^/(linkrad-extras\.js|linkrad-toolbar\.js|app-config\.js|index\.html)$ {
    root /usr/share/nginx/html;
    add_header Cross-Origin-Resource-Policy cross-origin;
    add_header Cross-Origin-Opener-Policy same-origin;
    add_header Cross-Origin-Embedder-Policy require-corp;
    add_header Cache-Control "no-cache, must-revalidate";
    expires 0;
  }

  # Cache per-instance DICOM bytes in the browser. SOPInstanceUIDs are
  # immutable by DICOM spec — once Orthanc has the instance, its pixel
  # data and metadata never change — so it's safe to cache forever, and
  # scroll-back through a CT/MR series becomes instant after first load.
  # Pattern matches /wado/studies/<UID>/series/<UID>/instances/<UID>
  # and the multi-frame variant .../instances/<UID>/frames/<N>.
  # Regex locations are matched before prefix locations in nginx, so this
  # short-circuits the broader /wado/ rule below.
  # NB: proxy_pass in a regex location must NOT have a path component —
  # nginx forwards the full original request URI to the upstream as-is.
  location ~ ^/wado/studies/[^/]+/series/[^/]+/instances/[^/]+(?:/frames/[^/]+)?/?$ {
    proxy_pass ${ORTHANC_BACKEND_URL};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization";
    # CORP: cross-origin needed because OHIF page uses COEP: require-corp.
    add_header Cross-Origin-Resource-Policy cross-origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    if ($request_method = OPTIONS) { return 204; }
  }

  # Proxy DICOMweb (WADO-RS/QIDO-RS) to Orthanc
  # ORTHANC_BACKEND_URL is substituted at container startup via envsubst
  # Works for both http://orthanc:8042 (local) and https://... (cloud)
  #
  # Host header: rely on nginx default (Host: $proxy_host = upstream hostname).
  # Do NOT override to $host — Railway routes by Host, so sending OHIF's own
  # domain causes an edge-routing loop back to OHIF (→ 502 after timeout).
  location /wado/ {
    proxy_pass ${ORTHANC_BACKEND_URL}/wado/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Authorization";
    # CORP: cross-origin needed because OHIF page uses COEP: require-corp.
    # Without this, the browser blocks DICOM fetches from the WADO proxy.
    add_header Cross-Origin-Resource-Policy cross-origin;
    if ($request_method = OPTIONS) { return 204; }
  }

  # Proxy WADO-URI
  location = /wado {
    proxy_pass ${ORTHANC_BACKEND_URL}/wado;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    add_header Access-Control-Allow-Origin *;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
