server {
  listen 80 default_server;
  listen [::]:80 default_server;

  # Serve OHIF React SPA
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    # OHIF's entrypoint empties app-config.js and pre-compresses it to .gz
    # gzip_static makes nginx serve the .gz version to browsers that accept gzip
    gzip_static on;
  }

  # Proxy DICOMweb to Orthanc — server-to-server, no CORS issue
  location /wado/ {
    proxy_pass https://linkrad-production-2fde.up.railway.app/wado/;
    proxy_set_header Host linkrad-production-2fde.up.railway.app;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Accept";
    if ($request_method = OPTIONS) { return 204; }
  }

  location = /wado {
    proxy_pass https://linkrad-production-2fde.up.railway.app/wado;
    proxy_set_header Host linkrad-production-2fde.up.railway.app;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    add_header Access-Control-Allow-Origin *;
  }
}
